<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JR Verifica EC{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50:  '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                    },
                    boxShadow: {
                        'soft':    '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.06)',
                        'card':    '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 4px 12px -2px rgba(15, 23, 42, 0.04)',
                        'elevate': '0 10px 40px -10px rgba(15, 23, 42, 0.15)',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        ::selection { background-color: #e0e7ff; color: #312e81; }

        /* Inputs y buttons */
        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.625rem 1rem; border-radius: 0.625rem;
            background-color: #4f46e5; color: white; font-weight: 600; font-size: 0.875rem;
            transition: background-color 150ms;
            border: 1px solid transparent;
        }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.625rem 1rem; border-radius: 0.625rem;
            background-color: white; color: #334155; font-weight: 600; font-size: 0.875rem;
            border: 1px solid #e2e8f0;
            transition: all 150ms;
        }
        .btn-secondary:hover { background-color: #f8fafc; border-color: #cbd5e1; }

        .btn-ghost {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 0.75rem; border-radius: 0.5rem;
            color: #64748b; font-weight: 500; font-size: 0.875rem;
            transition: all 150ms;
        }
        .btn-ghost:hover { background-color: #f1f5f9; color: #0f172a; }

        .input {
            width: 100%; padding: 0.625rem 0.875rem;
            border: 1px solid #e2e8f0; border-radius: 0.625rem;
            font-size: 0.875rem; color: #0f172a; background-color: white;
            transition: all 150ms;
        }
        .input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

        .card {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.875rem;
            box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
        }

        /* Badges */
        .badge {
            display: inline-flex; align-items: center; gap: 0.375rem;
            padding: 0.25rem 0.625rem; border-radius: 9999px;
            font-size: 0.7rem; font-weight: 600; letter-spacing: 0.01em;
        }
        .badge-dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; }

        .badge-apto    { background: #ecfdf5; color: #047857; }
        .badge-apto .badge-dot { background: #10b981; }
        .badge-obs     { background: #fefce8; color: #a16207; }
        .badge-obs .badge-dot  { background: #eab308; }
        .badge-rech    { background: #fef2f2; color: #b91c1c; }
        .badge-rech .badge-dot { background: #ef4444; }
        .badge-crit    { background: #450a0a; color: #fee2e2; }
        .badge-crit .badge-dot { background: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.4); }
        .badge-sin     { background: #f1f5f9; color: #475569; }
        .badge-sin .badge-dot  { background: #94a3b8; }

        /* Nav active */
        .nav-link { color: #475569; padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem; transition: all 150ms; display: inline-flex; align-items: center; gap: 0.4rem; }
        .nav-link:hover { background-color: #f1f5f9; color: #0f172a; }
        .nav-link.active { background-color: #eef2ff; color: #4338ca; }

        /* Icon sizes */
        .icon-xs { width: 14px; height: 14px; }
        .icon-sm { width: 16px; height: 16px; }
        .icon-md { width: 20px; height: 20px; }
        .icon-lg { width: 24px; height: 24px; }

        /* Print */
        @media print {
            nav, footer, .no-print { display: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    {% block navbar %}
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 backdrop-blur supports-[backdrop-filter]:bg-white/85">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 group">
                <img src="/static/logo.png" alt="JR Automata" class="h-9 w-9" onerror="this.style.display='none'">
                <div class="flex flex-col leading-tight">
                    <span class="text-[15px] font-bold text-slate-900 tracking-tight">JR Verifica EC</span>
                    <span class="text-[10px] text-slate-500 font-medium">by JR Automata</span>
                </div>
            </a>

            {% if request.cookies.get('jr_session') %}
            <div class="flex items-center gap-1">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                    <i data-lucide="search" class="icon-sm"></i>
                    <span class="hidden sm:inline">Buscar</span>
                </a>
                <a href="/dashboard" class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}">
                    <i data-lucide="bar-chart-3" class="icon-sm"></i>
                    <span class="hidden sm:inline">Dashboard</span>
                </a>
                <a href="/historial" class="nav-link {% if '/historial' in request.url.path %}active{% endif %}">
                    <i data-lucide="history" class="icon-sm"></i>
                    <span class="hidden sm:inline">Historial</span>
                </a>
                <div class="w-px h-6 bg-slate-200 mx-2"></div>
                <a href="/logout" class="btn-ghost">
                    <i data-lucide="log-out" class="icon-sm"></i>
                    <span class="hidden sm:inline">Salir</span>
                </a>
            </div>
            {% endif %}
        </div>
    </nav>
    {% endblock %}

    <main class="max-w-7xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 mt-20 no-print">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
            <div class="flex items-center gap-2">
                <img src="/static/logo.png" alt="" class="h-5 w-5 opacity-70" onerror="this.style.display='none'">
                <span>JR Automata · Inteligencia Administrativa & Automatización</span>
            </div>
            <div class="flex items-center gap-4">
                <span>Fuentes: Ministerio de Educación · Función Judicial</span>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
