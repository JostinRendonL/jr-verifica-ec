<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JR Verifica EC{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #1A3A5C 0%, #2980B9 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 40px -10px rgba(26, 58, 92, 0.25);
        }
        @media print {
            nav, footer, button { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    {% block navbar %}
    <nav class="gradient-bg text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3 hover:opacity-90 transition">
                <img src="/static/logo.png" alt="JR Automata"
                     class="h-11 w-auto bg-white rounded-lg p-1"
                     onerror="this.style.display='none'">
                <div>
                    <div class="text-xl font-extrabold tracking-tight leading-tight">JR Verifica EC</div>
                    <div class="text-[10px] text-white/70 leading-tight">powered by JR Automata</div>
                </div>
            </a>
            {% if request.cookies.get('jr_session') %}
            <div class="flex items-center gap-5">
                <a href="/historial" class="text-sm text-white/90 hover:text-white transition flex items-center gap-1.5 font-medium">
                    📜 Historial
                </a>
                <a href="/logout" class="text-sm text-white/80 hover:text-white transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Cerrar sesión
                </a>
            </div>
            {% endif %}
        </div>
    </nav>
    {% endblock %}

    <main class="max-w-6xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-xs text-slate-400 py-6">
        Verificación oficial: Ministerio de Educación + Función Judicial · JR Automata © 2026
    </footer>
</body>
</html>
