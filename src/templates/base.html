<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JR Verifica EC{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #1A3A5C 0%, #2980B9 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 40px -10px rgba(26, 58, 92, 0.25);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    {% block navbar %}
    <nav class="gradient-bg text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <a href="/" class="flex items-center gap-3">
                    <div class="text-2xl font-extrabold tracking-tight">⚙️ JR Verifica EC</div>
                    <span class="text-xs bg-white/20 px-2 py-1 rounded-full">powered by JR Automata</span>
                </a>
            </div>
            {% if request.cookies.get('jr_session') %}
            <a href="/logout" class="text-sm text-white/80 hover:text-white transition">Cerrar sesión</a>
            {% endif %}
        </div>
    </nav>
    {% endblock %}

    <main class="max-w-6xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-xs text-slate-400 py-6">
        Verificación oficial: Ministerio de Educación + Función Judicial · JR Automata © 2026
    </footer>
</body>
</html>
